# RoomOS — M0 à M4.
# Prometheus et Grafana arrivent en M6.
services:
  core:
    build:
      context: ..
      dockerfile: Dockerfile
    image: roomos-core:latest
    container_name: roomos-core
    restart: unless-stopped

    # Réseau de l'hôte, et non bridge : le Wake-on-LAN est un broadcast UDP dirigé
    # vers 192.168.1.255. Depuis un bridge Docker (172.x), ce broadcast n'est pas
    # sur le lien local du conteneur et Linux ne relaie pas les broadcasts dirigés :
    # le paquet magique n'atteint jamais le LAN. Vérifié à la capture : zéro paquet
    # sur ens18 en mode bridge. Voir docs/03-architecture.md.
    #
    # Conséquence : le Core ne résout pas les noms de services Docker. Il joint
    # Mosquitto par 127.0.0.1, d'où la publication du port ci-dessous.
    network_mode: host

    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:${CORE_PORT:-8080}
    env_file:
      - .env
    volumes:
      - roomos-data:/data
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: roomos-mosquitto
    restart: unless-stopped
    # Publié sur la boucle locale uniquement : le Core y accède depuis l'hôte,
    # Zigbee2MQTT depuis le réseau interne, et personne depuis le LAN.
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data

  # Démarré uniquement quand le coordinateur Zigbee est branché :
  #   docker compose --profile zigbee up -d
  # Sans coordinateur joignable, Zigbee2MQTT redémarre en boucle.
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    container_name: roomos-zigbee2mqtt
    restart: unless-stopped
    profiles: [zigbee]
    ports:
      - "127.0.0.1:8099:8080"
    volumes:
      - ./zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    depends_on:
      - mosquitto

  # Historique de la télémétrie. Le Core n'en garde que le dernier échantillon en
  # mémoire (ADR D6) ; c'est Prometheus qui conserve, en scrutant /metrics.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: roomos-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 30 jours suffisent pour repérer une dérive thermique ; au-delà, la VM a
      # mieux à faire de ses 30 Go.
      - --storage.tsdb.retention.time=30d
    extra_hosts:
      # Le Core est en réseau hôte : il n'a pas de nom de service Docker.
      - "host.docker.internal:host-gateway"
    # La VM a 3,8 Go et fait déjà tourner le Core, Mosquitto et Zigbee2MQTT.
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.5.1
    container_name: roomos-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-roomos}
      # Pas d'inscription ni d'analytics sur un tableau de bord domestique.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    mem_limit: 384m
    depends_on:
      - prometheus

volumes:
  roomos-data:
  mosquitto-data:
  prometheus-data:
  grafana-data:
