# RoomOS — courtier MQTT local.
#
# Pas d'authentification : le port n'est publié que sur 127.0.0.1 (voir
# docker-compose.yml), donc seul l'hôte y accède. Zigbee2MQTT, lui, passe par le
# réseau interne Docker. Rien n'est joignable depuis le LAN.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
