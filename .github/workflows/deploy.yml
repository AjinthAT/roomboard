name: Deploy

# Déploiement sur la VM, après une CI verte sur main. Le runner est auto-hébergé :
# la VM est la cible, elle se déploie elle-même.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Ne déploie que si la CI a réussi. Sans cette garde, un push cassé partirait
    # en production — ici, la chambre.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted

    steps:
      # Pas de checkout : on déploie le clone canonique de la VM, celui que
      # docker compose connaît déjà. Un checkout dans l'espace de travail du runner
      # créerait une seconde pile en parallèle de la vraie.
      # ROOMOS_DIR vit dans l'environnement du runner (~/actions-runner/.env) :
      # l'emplacement du clone dépend de la machine, pas du projet, et n'a rien à
      # faire en dur dans un dépôt public.
      - name: Mettre à jour le dépôt
        run: |
          cd "${ROOMOS_DIR:-$HOME/roomboard}"
          git fetch --quiet origin main
          git reset --hard origin/main

      - name: Reconstruire et redémarrer
        run: |
          cd "${ROOMOS_DIR:-$HOME/roomboard}/deploy"
          docker compose up -d --build core

      - name: Vérifier que le Core répond
        run: |
          for i in $(seq 1 30); do
            if curl -sf -m 5 http://127.0.0.1:8080/healthz > /dev/null; then
              echo "Core en ligne."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le Core ne répond pas après 60 s."
          cd ~/roomboard/deploy && docker compose logs core --tail 40
          exit 1
